<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>MeshCore Galicia — Acceso</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Panel MeshCore"%3E %3Crect width="64" height="64" rx="14" fill="%230f151f"/%3E %3Cg stroke="%233fd67a" stroke-width="2.4" stroke-linecap="round" fill="none"%3E %3Cpath d="M18 44 L32 26 L46 44 Z" opacity=".55"/%3E %3Cpath d="M24.5 17.5 a10.5 10.5 0 0 1 15 0" opacity=".8"/%3E %3Cpath d="M20 13 a17 17 0 0 1 24 0" opacity=".45"/%3E %3C/g%3E %3Cg fill="%233fd67a"%3E %3Ccircle cx="32" cy="26" r="5"/%3E %3Ccircle cx="18" cy="44" r="4.2"/%3E %3Ccircle cx="46" cy="44" r="4.2"/%3E %3C/g%3E %3C/svg%3E">
<style>
:root{
  --bg:#0a0d12;--pan:#121822;--card:#141b26;--brd:#232e3d;
  --fg:#e8eef4;--dim:#8b98a8;--dim2:#5c6b7d;
  --acc:#3fd67a;--err:#ff6b6b;
  --mono:ui-monospace,'Cascadia Code',Consolas,monospace;
  --sans:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:radial-gradient(1200px 700px at 50% -20%,#111a28 0%,var(--bg) 60%);
  color:var(--fg);font:15px/1.5 var(--sans);
  display:flex;align-items:center;justify-content:center;padding:24px;
}
.card{
  width:100%;max-width:400px;
  background:linear-gradient(180deg,var(--card),#101620);
  border:1px solid var(--brd);border-radius:16px;
  padding:32px 28px;box-shadow:0 24px 70px rgba(0,0,0,.55);
  position:relative;overflow:hidden;
}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--acc),#2fb968)}
h1{font-size:21px;margin:0;font-weight:800;letter-spacing:.01em}
h1 span{color:var(--acc)}
.sub{color:var(--dim);font-size:12.5px;margin-top:4px;font-family:var(--mono)}
.logo{font-size:34px;line-height:1;margin-bottom:14px}
form{margin-top:26px;display:flex;flex-direction:column;gap:14px}
label{font-size:11px;color:var(--dim2);text-transform:uppercase;letter-spacing:.07em;
  display:block;margin-bottom:6px;font-weight:700}
input{
  width:100%;background:#0c1119;color:var(--fg);
  border:1px solid var(--brd);border-radius:9px;
  padding:12px 13px;font:inherit;font-size:15px;
  transition:border-color .15s,box-shadow .15s;
}
input:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px rgba(63,214,122,.13)}
input:disabled{opacity:.55}
button{
  margin-top:6px;width:100%;
  background:linear-gradient(180deg,#42dd82,#2fb968);color:#04180c;
  border:none;border-radius:9px;padding:13px;
  font:inherit;font-size:15px;font-weight:800;cursor:pointer;
  transition:filter .15s;
}
button:hover:not(:disabled){filter:brightness(1.07)}
button:disabled{opacity:.6;cursor:progress}
.msg{
  display:none;margin-top:16px;padding:11px 13px;border-radius:9px;
  font-size:13px;line-height:1.45;
  background:#2a1214;border:1px solid #6b2229;color:#ffb3b3;
}
.msg.on{display:block}
.foot{margin-top:24px;padding-top:18px;border-top:1px solid var(--brd);
  color:var(--dim2);font-size:11.5px;font-family:var(--mono);text-align:center}
@media (max-width:420px){.card{padding:26px 20px}h1{font-size:19px}}
</style>
</head>
<body>
  <div class="card">
    <div class="logo">📡</div>
    <h1>Mesh<span>Core</span> Galicia</h1>
    <div class="sub">Panel de equipos</div>

    <form id="f" autocomplete="on">
      <div>
        <label for="u">Usuario</label>
        <input id="u" name="username" type="text" autocomplete="username"
               autocapitalize="none" autocorrect="off" spellcheck="false" required autofocus>
      </div>
      <div>
        <label for="p">Contraseña</label>
        <input id="p" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button id="b" type="submit">Entrar</button>
    </form>

    <div class="msg" id="m" role="alert"></div>
    
  </div>

<script>
(() => {
  'use strict';
  const form = document.getElementById('f');
  const btn  = document.getElementById('b');
  const msg  = document.getElementById('m');

  function fail(text) {
    msg.textContent = text;
    msg.classList.add('on');
    btn.disabled = false;
    document.getElementById('p').value = '';
    document.getElementById('p').focus();
  }

  form.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    msg.classList.remove('on');
    btn.disabled = true;
    btn.textContent = 'Comprobando...';
    try {
      const r = await fetch('/api/auth/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          username: document.getElementById('u').value,
          password: document.getElementById('p').value
        })
      });
      if (r.ok) {
        // ?next= lo pone nginx al redirigir; solo se aceptan rutas internas
        // para que nadie pueda usar el login como redirector abierto.
        const next = new URLSearchParams(location.search).get('next') || '/';
        // '/\\otro.com' o '/%09/otro.com' pasaban el filtro anterior y el navegador
        // los trata como '//otro.com': se resuelve y se exige el mismo origen.
        let destino = '/';
        try { const u = new URL(next, location.origin); if (u.origin === location.origin) destino = u.pathname + u.search + u.hash; } catch (_) {}
        location.replace(destino);
        return;
      }
      const body = await r.json().catch(() => ({}));
      fail(body.error || 'Usuario o contraseña incorrectos.');
    } catch (e) {
      fail('No se puede contactar con el servidor: ' + e.message);
    } finally {
      btn.textContent = 'Entrar';
    }
  });
})();
</script>
</body>
</html>
