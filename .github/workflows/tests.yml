name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      # openssl y htpasswd (apache2-utils) los usan los tests de login bcrypt.
      - run: sudo apt-get update && sudo apt-get install -y openssl apache2-utils
      # requirements.txt solo trae aiohttp y bleak; bleak va en Linux y winrt se importa
      # de forma perezosa solo en Windows, así que los tests del relay corren aquí.
      - run: pip install -r bridge/requirements.txt
      - run: bash tools/run-tests.sh
  # Abre el panel en un navegador con datos inventados y pulsa todo (tools/e2e): errores de JavaScript,
  # pantallas, desbordes en móvil, código inyectado, Gestión, «reducir movimiento» y accesibilidad (axe-core).
  navegador:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - run: pip install playwright==1.63.0
      - run: python -m playwright install --with-deps chromium
      - run: npm ci --prefix tools/e2e
      - run: python tools/e2e/test_e2e.py
