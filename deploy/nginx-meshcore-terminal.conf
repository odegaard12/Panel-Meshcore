# Terminal web de la Pi (ttyd con bash). Quien entra aqui tiene la Pi entera
# (el usuario tiene sudo sin contrasena), asi que usa el MISMO login que el
# panel: cookie de sesion firmada, con bloqueo por intentos fallidos. Antes era
# auth_basic, que dejaba probar contrasenas sin limite. La cookie del panel
# vale aqui tambien (las cookies no distinguen puertos): no hay doble login.
server {
    listen 7443 ssl;
    listen [::]:7443 ssl;
    server_name __PI_IP__;

    ssl_certificate     /etc/nginx/meshcore-tls/cert.pem;
    ssl_certificate_key /etc/nginx/meshcore-tls/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Que ninguna otra web pueda meter esto en un marco (clickjacking) ni que el
    # navegador adivine tipos de fichero.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' wss:; img-src 'self' data:; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), bluetooth=(), usb=()" always;

    location = /_auth {
        internal;
        # Shell con sudo: solo con una sesión abierta hace menos de 2 h.
        proxy_pass http://127.0.0.1:8780/api/auth/verify?max_horas=2;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }
    # Sin sesion: al formulario de login del panel (puerto 443).
    error_page 401 = @login;
    location @login {
        return 302 https://$host/login.html;
    }

    location / {
        auth_request /_auth;
        proxy_pass http://127.0.0.1:7681;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # $http_host conserva el :7443: ttyd -O compara Origin con Host y con
        # $host (sin puerto) rechazaria todas las conexiones.
        proxy_set_header Host $http_host;
        proxy_read_timeout 86400;
    }
}
