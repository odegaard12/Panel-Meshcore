# Terminal web de la Pi (ttyd con bash). Quien entra aqui tiene la Pi entera, asi que
# pide DOS cosas: la sesion del panel abierta hace menos de 2 h y, ademas, una
# contrasena propia de la terminal (auth_basic con su htpasswd y freno de intentos).
# Asi una cookie del panel robada ya no da una shell. Crear la contrasena con:
#   sudo htpasswd -cB /etc/nginx/meshcore-tls/terminal.htpasswd <usuario>
# Sin ese fichero nginx devuelve 500: la terminal queda cerrada, no abierta.
server {
    listen 7443 ssl;
    listen [::]:7443 ssl;
    server_name __PI_IP__;

    ssl_certificate     /etc/nginx/meshcore-tls/cert.pem;
    ssl_certificate_key /etc/nginx/meshcore-tls/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    # Que ninguna otra web pueda meter esto en un marco (clickjacking) ni que el
    # navegador adivine tipos de fichero.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), bluetooth=(), usb=()" always;

    location = /_auth {
        internal;
        # Shell con sudo: solo con una sesión abierta hace menos de 2 h.
        proxy_pass http://127.0.0.1:8780/api/auth/verify?max_horas=2;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        # El 401 sin sesion pasa a 403 para no mezclarlo con el 401 de la contrasena de la terminal.
        proxy_intercept_errors on;
        error_page 401 = @sin_sesion;
    }
    location @sin_sesion {
        return 403;
    }
    # Sin sesion (o mas de 2 h): al login del panel. El 401 de auth_basic NO se toca: sale el cuadro de contrasena.
    error_page 403 = @login;
    location @login {
        return 302 https://$host/login.html;
    }

    location / {
        auth_request /_auth;
        auth_basic "Terminal de la Pi";
        auth_basic_user_file /etc/nginx/meshcore-tls/terminal.htpasswd;
        limit_req zone=meshcore_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:7681;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # $http_host conserva el :7443: ttyd -O compara Origin con Host y con
        # $host (sin puerto) rechazaria todas las conexiones.
        proxy_set_header Host $http_host;
        proxy_read_timeout 86400;
    }
}
