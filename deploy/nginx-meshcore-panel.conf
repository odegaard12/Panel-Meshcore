# Panel MeshCore + API del gateway BLE.
#
# La autenticacion NO usa auth_basic (popup del navegador, no estilable, sin
# cerrar sesion). nginx delega con auth_request en /api/auth/verify del gateway,
# que valida una cookie de sesion firmada. Si falla, error_page 401 lleva al
# formulario /login.html.
#
# Reparto de responsabilidades:
#   - nginx   = TLS y punto unico de entrada; decide que pasa y que no
#   - gateway = valida credenciales contra el htpasswd y firma la sesion
#   - token   = secreto interno, impide llamar al gateway saltandose nginx
# Freno al login en nginx (10 por minuto por IP), ademas del bloqueo del
# gateway tras 8 fallos: asi ni siquiera llegan al hash los intentos en rafaga.
limit_req_zone $binary_remote_addr zone=meshcore_login:1m rate=10r/m;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name __PI_IP__;

    ssl_certificate     /etc/nginx/meshcore-tls/cert.pem;
    ssl_certificate_key /etc/nginx/meshcore-tls/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Que ninguna otra web pueda meter esto en un marco (clickjacking) ni que el
    # navegador adivine tipos de fichero.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), usb=(), bluetooth=(), serial=(), payment=()" always;
    # Lo que carga de verdad el panel: Leaflet desde unpkg, teselas de mapa de
    # OSM/OpenTopoMap/ArcGIS (img-src https:) y la API propia (connect-src
    # 'self'; las altitudes van por /api/ble/elevation). 'unsafe-inline' porque
    # el panel es un HTML con su script y estilos dentro.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com; style-src 'self' 'unsafe-inline' https://unpkg.com https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;

    # Ninguna peticion legitima del panel pasa de unos KB.
    client_max_body_size 64k;

    # El relay del PC entra por aqui con TLS (wss://) y su propio token; solo
    # desde la IP del PC. Ninguna sesion de navegador sirve: el gateway exige
    # el token del relay, que nginx no anade en esta ruta.
    location = /api/ble/relay {
        auth_request off;
        allow __RELAY_IP__;
        deny all;
        proxy_pass http://127.0.0.1:8780;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Subpeticion interna: no accesible desde fuera.
    location = /api/auth/verify {
        internal;
        proxy_pass http://127.0.0.1:8780/api/auth/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-MeshCore-Token __GATEWAY_TOKEN__;
    }

    # Sin sesion: las paginas van al formulario conservando el destino; las
    # llamadas de API reciben 401 JSON, porque un fetch() no sabe que hacer con
    # una redireccion a HTML.
    error_page 401 = @to_login;
    location @to_login {
        return 302 /login.html?next=$request_uri;
    }
    location @api_401 {
        default_type application/json;
        return 401 '{"error":"sesion requerida","login":"/login.html"}';
    }

    # Estas dos son publicas por necesidad: son justamente como se obtiene sesion.
    location = /login.html {
        auth_request off;
        proxy_pass http://127.0.0.1:8765/login.html;
        proxy_set_header Host $host;
    }

    location = /api/auth/login {
        auth_request off;
        limit_req zone=meshcore_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8780/api/auth/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-MeshCore-Token __GATEWAY_TOKEN__;
    }

    # MESHCORE_BLE_PROXY_MARKER
    location /api/ble/ {
        auth_request /api/auth/verify;
        error_page 401 = @api_401;
        proxy_pass http://127.0.0.1:8780;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-MeshCore-Token __GATEWAY_TOKEN__;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
        proxy_buffering off;
    }

    location /api/auth/ {
        auth_request off;
        proxy_pass http://127.0.0.1:8780;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-MeshCore-Token __GATEWAY_TOKEN__;
    }

    location / {
        auth_request /api/auth/verify;
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60;
    }
}
