# Panel MeshCore + API del gateway BLE.
#
# La autenticacion NO usa auth_basic (popup del navegador, no estilable, sin
# cerrar sesion). nginx delega con auth_request en /api/auth/verify del gateway,
# que valida una cookie de sesion firmada. Si falla, error_page 401 lleva al
# formulario /login.html.
#
# Reparto de responsabilidades:
#   - nginx   = TLS y punto unico de entrada; decide que pasa y que no
#   - gateway = valida credenciales contra el htpasswd y firma la sesion
#   - token   = secreto interno, impide llamar al gateway saltandose nginx
# Freno al login en nginx (10 por minuto por IP), ademas del bloqueo del
# gateway tras 8 fallos: asi ni siquiera llegan al hash los intentos en rafaga.
limit_req_zone $binary_remote_addr zone=meshcore_login:1m rate=10r/m;
# Freno general a la API: el panel hace unas pocas peticiones por segundo.
limit_req_zone $binary_remote_addr zone=meshcore_api:1m rate=10r/s;
# Si el panel va detrás de Cloudflare u otro proxy, TODOS llegan con la IP del proxy y
# el freno por IP bloquearía a todo el mundo a la vez. En ese caso, descomentar:
#   set_real_ip_from 127.0.0.1;            # o el rango del proxy
#   real_ip_header CF-Connecting-IP;      # X-Forwarded-For con otros proxies

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name __PI_IP__;

    ssl_certificate     /etc/nginx/meshcore-tls/cert.pem;
    ssl_certificate_key /etc/nginx/meshcore-tls/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    # Cifrados «intermediate» de Mozilla para TLS 1.2 (TLS 1.3 ya trae los suyos).
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_tickets off;
    # Sin versión de nginx en errores ni cabeceras.
    server_tokens off;

    # Que ninguna otra web pueda meter esto en un marco (clickjacking) ni que el
    # navegador adivine tipos de fichero.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), usb=(), bluetooth=(), serial=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # Lo que carga de verdad el panel: Leaflet servido desde la propia Pi (vendor/), teselas
    # de OSM/OpenTopoMap/ArcGIS (solo esos hosts en img-src) y la API propia (connect-src
    # 'self'; las altitudes van por /api/ble/elevation). 'unsafe-inline' porque
    # el panel es un HTML con su script y estilos dentro.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://*.tile.opentopomap.org https://server.arcgisonline.com; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
    # El gzip global solo comprime HTML: los JS (unos 340 KB) viajaban sin comprimir.
    gzip_types text/css application/javascript text/javascript image/svg+xml application/manifest+json;
    gzip_vary on;

    # Ninguna peticion legitima del panel pasa de unos KB.
    client_max_body_size 64k;

    # El relay del PC entra por aqui con TLS (wss://) y su propio token; solo
    # desde la IP del PC. Ninguna sesion de navegador sirve: el gateway exige
    # el token del relay, que nginx no anade en esta ruta.
    location = /api/ble/relay {
        auth_request off;
        allow __RELAY_IP__;
        deny all;
        proxy_pass http://127.0.0.1:8780;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Subpeticion interna: no accesible desde fuera.
    location = /api/auth/verify {
        internal;
        proxy_pass http://127.0.0.1:8780/api/auth/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-MeshCore-Token __GATEWAY_TOKEN__;
    }

    # Sin sesion: las paginas van al formulario conservando el destino; las
    # llamadas de API reciben 401 JSON, porque un fetch() no sabe que hacer con
    # una redireccion a HTML.
    error_page 401 = @to_login;
    location @to_login {
        return 302 /login.html?next=$request_uri;
    }
    location @api_401 {
        default_type application/json;
        return 401 '{"error":"sesion requerida","login":"/login.html"}';
    }

    # Estas dos son publicas por necesidad: son justamente como se obtiene sesion.
    location = /login.html {
        auth_request off;
        proxy_pass http://127.0.0.1:8765/login.html;
        proxy_set_header Host $host;
    }
    # Sin esto el login no funciona: la CSP no deja scripts en línea y, sin sesión,
    # /login.js se redirigía al propio login (HTML servido como script).
    location = /login.js {
        auth_request off;
        proxy_pass http://127.0.0.1:8765/login.js;
        proxy_set_header Host $host;
    }
    # Copias, ficheros ocultos y restos de editor que alguien deje en www: nunca se sirven.
    location ~ (/\.|~$|\.(bak|old|orig|swp|tmp|save|json|jsonl|log|tar|gz|zip|sh|py|pem|key)$) {
        return 404;
    }

    location = /api/auth/login {
        auth_request off;
        limit_req zone=meshcore_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8780/api/auth/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-MeshCore-Token __GATEWAY_TOKEN__;
    }

    # MESHCORE_BLE_PROXY_MARKER
    location /api/ble/ {
        auth_request /api/auth/verify;
        error_page 401 = @api_401;
        limit_req zone=meshcore_api burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8780;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-MeshCore-Token __GATEWAY_TOKEN__;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
        proxy_buffering off;
    }

    location ~ ^/api/auth/(whoami|logout)$ {
        auth_request off;
        limit_req zone=meshcore_login burst=20 nodelay;
        proxy_pass http://127.0.0.1:8780;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-MeshCore-Token __GATEWAY_TOKEN__;
    }

    location /api/auth/ {
        return 404;
    }

    location / {
        auth_request /api/auth/verify;
        # Que el navegador vuelva a preguntar: tras cerrar sesión, «Atrás» no enseña el panel
        # (expires no usa add_header, así que no pisa las cabeceras de seguridad).
        expires epoch;
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60;
    }
}
